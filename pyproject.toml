[project]
    name = "signbridge"
    version = "0.1.0"
    description = "Streaming sign language recognition — landmark-sequence models (GISLR/POPSIGN) with real-time, frame-by-frame inference as the deployment target"
    readme = "README.md"
    requires-python = ">=3.12"
    # The workspace root is a virtual project: it owns no code, it just pulls in
    # every package plus the notebook surface. All library code lives in
    # packages/sb-*/ (see README § Project structure).
    dependencies = [
        "sb-core",
        "sb-extract",
        "sb-recognize",
        "sb-mlops",
        "sb-rescore",
        "sb-synthesize",
        "jupyter>=1.1.1",
    ]

[tool.uv]
    package = false # virtual root: nothing to build here

[tool.uv.workspace]
    members = ["packages/*"]

[[tool.uv.index]]
    # workspace-wide: members inherit it, sb-recognize pins torch to it
    name     = "pytorch-cuda"
    url      = "https://download.pytorch.org/whl/cu130"
    explicit = true

[tool.uv.sources]
    sb-core       = { workspace = true }
    sb-extract    = { workspace = true }
    sb-recognize  = { workspace = true }
    sb-mlops      = { workspace = true }
    sb-rescore    = { workspace = true }
    sb-synthesize = { workspace = true }
    torch         = { index = "pytorch-cuda" }

[dependency-groups]
    dev = ["ty>=0.0.59", "types-tqdm>=4.68.0.20260608"]
    # Off-machine checkpoint sync (TODO 9.3). Optional so the default
    # environment stays lean -- install with: uv sync --group ops
    ops = ["boto3>=1.35.0"]

[tool.ty.environment]
    python = "./.venv"
