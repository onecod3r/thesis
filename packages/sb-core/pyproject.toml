[project]
    name = "sb-core"
    version = "0.1.0"
    description = "Shared contracts: landmark tensor schema, subsets, vocab, paths, IO -- imported by both pipeline stages and both directions"
    requires-python = ">=3.12"
    dependencies = [
        "numpy>=2.5.1",
        "pandas>=3.0.3",
        "kagglehub>=1.0.2",
        "kaggle>=1.6.17",
    ]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    # PEP 420 namespace: every package ships part of the `sb` namespace, and no
    # `sb/__init__.py` exists anywhere -- that is what lets them coexist.
    packages = ["src/sb"]

