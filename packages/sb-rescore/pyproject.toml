[project]
    name = "sb-rescore"
    version = "0.1.0"
    description = "Downstream of the recognizer: next-gloss prediction (n-gram / GRU LM) and gloss -> English (rules, Workers AI). Versioned prompts, a frozen eval set"
    requires-python = ">=3.12"
    dependencies = [
        "sb-core",
        "numpy",
    ]

[project.optional-dependencies]
    # the GRU language model arm (sb.rescore.neural); the n-gram needs none of it
    neural = ["torch"]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    # PEP 420 namespace: every package ships part of the `sb` namespace, and no
    # `sb/__init__.py` exists anywhere -- that is what lets them coexist.
    packages = ["src/sb"]

[tool.uv.sources]
    sb-core = { workspace = true }
