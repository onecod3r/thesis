[project]
    name = "sb-synthesize"
    version = "0.1.0"
    description = "Speech -> sign (future direction): text -> gloss -> pose sequence, emitting the same landmark tensor sb-core defines"
    requires-python = ">=3.12"
    dependencies = [
        "sb-core",
    ]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    # PEP 420 namespace: every package ships part of the `sb` namespace, and no
    # `sb/__init__.py` exists anywhere -- that is what lets them coexist.
    packages = ["src/sb"]

[tool.uv.sources]
    sb-core = { workspace = true }
