[project]
    name = "sb-recognize"
    version = "0.1.0"
    description = "Stage 2: landmark tensors -> gloss. Architectures, feature pipelines, training drivers, canonical evaluation, export"
    requires-python = ">=3.12"
    dependencies = [
        "sb-core",
        "sb-mlops",
        "torch>=2.13.0",
        "numpy>=2.5.1",
        "pandas>=3.0.3",
        # pandas' parquet engine: the motion-energy and feature-discriminability
        # notebooks cache their per-unit artifacts as parquet. Dropped with the
        # npz switch (2613426) while still in use; only a stale lock kept it installed.
        "pyarrow>=24.0.0",
        "scikit-learn>=1.9.0",
        "matplotlib>=3.11.0",
        "seaborn>=0.13.2",
        "tqdm>=4.67.0",
        "tensorflow>=2.21.0",
    ]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    # PEP 420 namespace: every package ships part of the `sb` namespace, and no
    # `sb/__init__.py` exists anywhere -- that is what lets them coexist.
    packages = ["src/sb"]

[tool.uv.sources]
    sb-core  = { workspace = true }
    sb-mlops = { workspace = true }
    torch    = { index = "pytorch-cuda" }

[project.scripts]
    sb-evaluate = "sb.recognize.evaluate:main"
